name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Not secret: Google documents these identifiers as safe to publish. Access is restricted
# to workflows from this repository by the Workload Identity provider's attribute condition.
env:
  FIREBASE_PROJECT: getfittogether-d667e
  WIF_PROVIDER: projects/1058630965558/locations/global/workloadIdentityPools/github/providers/github-repo
  WIF_SERVICE_ACCOUNT: github-deploy@getfittogether-d667e.iam.gserviceaccount.com

jobs:
  test:
    name: Typecheck, build, security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Firestore & Storage rules tests (emulators)
        run: npm run test:rules

  deploy:
    name: Deploy to Firebase
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # lets GitHub sign in to Google without a key file
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Deploy hosting, Firestore rules & indexes, Storage rules
        run: npx firebase deploy --only hosting,firestore,storage --project "${{ env.FIREBASE_PROJECT }}" --non-interactive --force

  preview:
    name: PR preview channel
    needs: test
    # fork PRs can't get Google credentials, so previews only run for branches in this repo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ env.FIREBASE_PROJECT }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
      - name: Deploy preview channel
        run: |
          npx firebase hosting:channel:deploy "pr-${{ github.event.pull_request.number }}" \
            --expires 7d --project "${{ env.FIREBASE_PROJECT }}" --non-interactive --json > preview.json
          URL=$(node -e "const r=require('./preview.json').result; console.log(Object.values(r)[0].url)")
          echo "Preview: $URL"
          echo "### Preview deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

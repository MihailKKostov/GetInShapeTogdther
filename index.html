<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="WeFit — get fit together: food log, workouts and progress with friends." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Installed-app name and icon. iOS reads these when you "Add to Home Screen"; Android uses the manifest. -->
    <meta name="application-name" content="WeFit" />
    <meta name="apple-mobile-web-app-title" content="WeFit" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the font without blocking first paint; the system font is used until it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <style>
      /* Shown instantly while the app's JavaScript loads; React replaces it. */
      html, body { margin: 0; background: #f3f4f6; }
      @media (prefers-color-scheme: dark) { html, body { background: #0f1115; } }
      .boot { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font: 800 26px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.03em; color: #1f2937; }
      @media (prefers-color-scheme: dark) { .boot { color: #e5e7eb; } }
      .boot img { width: 52px; height: 52px; border-radius: 14px; }
    </style>
    <title>WeFit — Get fit together</title>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/favicon.svg" alt="" />WeFit</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
